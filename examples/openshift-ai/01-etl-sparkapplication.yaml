# Example 1 - PySpark ETL as a SparkApplication. Code is baked into the application image;
# S3 / database settings and credentials come from the spark-datasources Secret.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: example-etl
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: EXAMPLES_IMAGE_PLACEHOLDER
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/app/etl.py
  arguments: ["--rows", "200000"]
  sparkVersion: 4.2.1
  restartPolicy: { type: Never }
  # Pod settings (env, volumes, securityContext) go in driver.template / executor.template.
  # The flat fields (driver.envFrom, spec.volumes, ...) are applied by the operator's pod
  # webhook, which OpenShift AI 3.5 only registers for the `default` namespace: anywhere else
  # they are silently ignored. Templates are passed to spark-submit and work in every namespace.
  # securityContext: NO runAsUser / runAsGroup - restricted-v2 assigns the UID.
  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark-operator-spark
    template:
      spec:
        containers:
          - name: spark-kubernetes-driver
            envFrom:
              - secretRef: { name: spark-datasources }
            securityContext:
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile: { type: RuntimeDefault }
  executor:
    instances: 2
    cores: 1
    memory: 1g
    template:
      spec:
        containers:
          - name: spark-kubernetes-executor
            envFrom:
              - secretRef: { name: spark-datasources }
            securityContext:
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile: { type: RuntimeDefault }
