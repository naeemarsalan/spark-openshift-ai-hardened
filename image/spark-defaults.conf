# Image-level defaults. Deliberately contains NO endpoints and NO credentials:
# those are supplied at runtime (--conf, SPARK_CONF_DIR ConfigMap, Secret-backed env vars).

# Keep every scratch location under /tmp so the root filesystem can be mounted read-only.
spark.jars.ivy                              /tmp/.ivy2
spark.sql.warehouse.dir                     /tmp/spark-warehouse
spark.driver.extraJavaOptions               -Djava.io.tmpdir=/tmp -Dderby.system.home=/tmp/derby
spark.executor.extraJavaOptions             -Djava.io.tmpdir=/tmp

# S3A: resolve credentials from the environment (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# injected from a Secret) or from a projected service-account token (IRSA / STS) - never from this file.
spark.hadoop.fs.s3a.aws.credentials.provider   software.amazon.awssdk.auth.credentials.EnvironmentVariableCredentialsProvider,software.amazon.awssdk.auth.credentials.WebIdentityTokenFileCredentialsProvider
