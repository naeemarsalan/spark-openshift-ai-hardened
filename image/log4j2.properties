# Logging defaults for the hardened image: Spark's own conf/log4j2.properties.template plus
# the security overrides at the bottom. Override at runtime by mounting a SPARK_CONF_DIR.
rootLogger.level = info
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex
logger.repl.name = org.apache.spark.repl.Main
logger.repl.level = warn
logger.thriftserver.name = org.apache.spark.sql.hive.thriftserver.SparkSQLCLIDriver
logger.thriftserver.level = warn
logger.jetty1.name = org.sparkproject.jetty
logger.jetty1.level = warn
logger.jetty2.name = org.sparkproject.jetty.util.component.AbstractLifeCycle
logger.jetty2.level = error
logger.replexprTyper.name = org.apache.spark.repl.SparkIMain$exprTyper
logger.replexprTyper.level = info
logger.replSparkILoopInterpreter.name = org.apache.spark.repl.SparkILoop$SparkILoopInterpreter
logger.replSparkILoopInterpreter.level = info
logger.parquet1.name = org.apache.parquet
logger.parquet1.level = error
logger.parquet2.name = parquet
logger.parquet2.level = error
logger.metastore.name = org.apache.hadoop.hive.metastore.RetryingHMSHandler
logger.metastore.level = fatal
logger.metastore2.name = org.apache.hadoop.hive.metastore.ObjectStore
logger.metastore2.level = error

# --- security overrides ---------------------------------------------------------------
# Spark Connect logs complete client requests at INFO (ExecuteInfo(...) from
# SparkConnectExecutionManager, and the execution/interceptor classes at lower levels).
# A request for a JDBC read contains the connection options, INCLUDING THE PASSWORD, in
# clear text. Keep these loggers at WARN so credentials sent by clients never reach pod logs.
logger.connectExecMgr.name = org.apache.spark.sql.connect.service.SparkConnectExecutionManager
logger.connectExecMgr.level = warn
logger.connectExecHolder.name = org.apache.spark.sql.connect.service.ExecuteHolder
logger.connectExecHolder.level = warn
logger.connectLoggingInterceptor.name = org.apache.spark.sql.connect.service.LoggingInterceptor
logger.connectLoggingInterceptor.level = warn
logger.connectExecution.name = org.apache.spark.sql.connect.execution
logger.connectExecution.level = warn
