# Spark Connect server managed by the OpenShift AI Spark Operator (RHOAI 3.5+).
# The operator replaces the image entrypoint with sbin/start-connect-server.sh
# (see tests/operator-compat.sh for a local emulation).
apiVersion: sparkoperator.k8s.io/v1alpha1
kind: SparkConnect
metadata:
  name: spark-connect
spec:
  sparkVersion: 4.2.1
  sparkConf:
    # Required with Spark 4.2 and 4.3: the operator sets spark.driver.bindAddress=0.0.0.0 and Spark
    # executors would otherwise dial that as the driver address (0.0.0.0:7078, connection
    # refused, server restart loop). false = use spark.driver.host, which the operator sets
    # to the pod IP.
    spark.kubernetes.executor.useDriverPodIP: "false"
  hadoopConf:
    fs.s3a.path.style.access: "true"
    fs.s3a.endpoint.region: us-east-1
  server:
    template:
      spec:
        serviceAccountName: spark-operator-spark
        containers:
          - name: spark-kubernetes-driver
            image: SPARK_IMAGE_PLACEHOLDER
            imagePullPolicy: IfNotPresent
            # S3A picks the endpoint up from the AWS SDK's own variable; credentials likewise.
            env:
              - { name: AWS_ENDPOINT_URL_S3, valueFrom: { secretKeyRef: { name: spark-datasources, key: S3_ENDPOINT, optional: true } } }
              - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: spark-datasources, key: AWS_ACCESS_KEY_ID, optional: true } } }
              - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: spark-datasources, key: AWS_SECRET_ACCESS_KEY, optional: true } } }
            resources:
              requests: { cpu: 500m, memory: 1500Mi }
              limits: { memory: 2Gi }
            securityContext:
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile: { type: RuntimeDefault }
  executor:
    instances: 2
    cores: 1
    memory: 1g
    template:
      spec:
        containers:
          - name: spark-kubernetes-executor
            image: SPARK_IMAGE_PLACEHOLDER
            imagePullPolicy: IfNotPresent
            env:
              - { name: AWS_ENDPOINT_URL_S3, valueFrom: { secretKeyRef: { name: spark-datasources, key: S3_ENDPOINT, optional: true } } }
              - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: spark-datasources, key: AWS_ACCESS_KEY_ID, optional: true } } }
              - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: spark-datasources, key: AWS_SECRET_ACCESS_KEY, optional: true } } }
            securityContext:
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile: { type: RuntimeDefault }
---
# Stable DNS name for clients: sc://spark-connect-service.<namespace>.svc.cluster.local:15002
apiVersion: v1
kind: Service
metadata:
  name: spark-connect-service
spec:
  type: ClusterIP
  selector:
    sparkoperator.k8s.io/connect-name: spark-connect
    spark-role: connect-server
  ports:
    - { name: spark-connect, port: 15002, targetPort: 15002, protocol: TCP }
---
# The operator leaves the server default-deny for ingress. Admit OpenShift AI workbenches
# (cross-namespace) ...
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spark-connect-from-workbenches
spec:
  podSelector:
    matchLabels: { spark-role: connect-server }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { opendatahub.io/dashboard: "true" } }
          podSelector: { matchLabels: { opendatahub.io/workbenches: "true" } }
      ports:
        - { protocol: TCP, port: 15002 }
---
# ... and clients running in the server's own namespace (used by the test script), plus
# executor -> driver traffic on every port. OpenShift AI's operator ships its own intra-Spark
# allow rules; stating it here keeps this policy correct on its own (NetworkPolicies are
# additive, so the overlap is harmless).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spark-connect-from-same-namespace
spec:
  podSelector:
    matchExpressions:
      - { key: spark-role, operator: In, values: [driver, connect-server] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { spark-role: executor }
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 4040 }
        - { protocol: TCP, port: 15002 }
