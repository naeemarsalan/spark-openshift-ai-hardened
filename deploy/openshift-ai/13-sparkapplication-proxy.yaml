# A SparkApplication that reaches S3 and the internet through a forward proxy.
# Each of the three layers has its own setting; see docs/enterprise.md.
# The test proxy listens on three ports so the test can tell the layers apart. A real proxy
# has one. The `trust` blocks are the same as in 12-sparkapplication-custom-ca.yaml and are
# only here because the test S3 endpoint uses a private CA.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: proxy-check
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: SPARK_IMAGE_PLACEHOLDER
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///jobs/proxy_check.py
  sparkVersion: 4.2.1
  restartPolicy: { type: Never }
  sparkConf:
    # 1. The S3 connector has its own proxy settings.
    spark.hadoop.fs.s3a.proxy.host: PROXY_HOST_PLACEHOLDER
    spark.hadoop.fs.s3a.proxy.port: "3128"
    # 2. Other JVM code. Keep the Kubernetes API and in-cluster names off the proxy.
    spark.driver.extraJavaOptions: "-Dhttps.proxyHost=PROXY_HOST_PLACEHOLDER -Dhttps.proxyPort=3129 -Dhttp.nonProxyHosts=kubernetes.default.svc|*.cluster.local|localhost|172.30.*"
    spark.executor.extraJavaOptions: "-Dhttps.proxyHost=PROXY_HOST_PLACEHOLDER -Dhttps.proxyPort=3129 -Dhttp.nonProxyHosts=kubernetes.default.svc|*.cluster.local|localhost|172.30.*"
  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark-operator-spark
    template:
      spec:
        volumes:
          - name: jobs
            configMap: { name: spark-test-jobs }
          - name: ca
            projected:
              sources:
                # Cluster-wide trust bundle plus the CAs an administrator added to OpenShift AI.
                # OpenShift AI creates this ConfigMap in every project.
                - configMap: { name: odh-trusted-ca-bundle, optional: true }
                # The CA that signs in-cluster service certificates.
                - configMap: { name: openshift-service-ca.crt, optional: true }
                # Your own: oc create configmap my-ca --from-file=ca.crt=<file>
                - configMap: { name: my-ca, optional: true }
          - name: trust
            emptyDir: {}
        initContainers:
          - name: trust
            image: SPARK_IMAGE_PLACEHOLDER
            command: ["update-ca-trust", "extract", "-o", "/trust"]
            volumeMounts:
              - { name: ca, mountPath: /etc/pki/ca-trust/source/anchors, readOnly: true }
              - { name: trust, mountPath: /trust }
            securityContext:
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              seccompProfile: { type: RuntimeDefault }
        containers:
          - name: spark-kubernetes-driver
            envFrom:
              - secretRef: { name: spark-datasources }
            env:
              - { name: S3_ENDPOINT, value: "S3_TLS_ENDPOINT_PLACEHOLDER" }
              # 3. Python code (and anything else that reads the standard variables).
              - { name: HTTPS_PROXY, value: "http://PROXY_HOST_PLACEHOLDER:3130" }
              - { name: NO_PROXY, value: "NO_PROXY_PLACEHOLDER" }
              - { name: PROXY_TEST_URL, value: "PROXY_TEST_URL_PLACEHOLDER" }
            volumeMounts:
              - { name: jobs, mountPath: /jobs }
              - { name: trust, mountPath: /etc/pki/ca-trust/extracted, readOnly: true }
            securityContext:
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile: { type: RuntimeDefault }
  executor:
    instances: 2
    cores: 1
    memory: 1g
    template:
      spec:
        volumes:
          - name: ca
            projected:
              sources:
                - configMap: { name: odh-trusted-ca-bundle, optional: true }
                - configMap: { name: openshift-service-ca.crt, optional: true }
                - configMap: { name: my-ca, optional: true }
          - name: trust
            emptyDir: {}
        initContainers:
          - name: trust
            image: SPARK_IMAGE_PLACEHOLDER
            command: ["update-ca-trust", "extract", "-o", "/trust"]
            volumeMounts:
              - { name: ca, mountPath: /etc/pki/ca-trust/source/anchors, readOnly: true }
              - { name: trust, mountPath: /trust }
            securityContext:
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              seccompProfile: { type: RuntimeDefault }
        containers:
          - name: spark-kubernetes-executor
            envFrom:
              - secretRef: { name: spark-datasources }
            env:
              - { name: S3_ENDPOINT, value: "S3_TLS_ENDPOINT_PLACEHOLDER" }
              # 3. Python code (and anything else that reads the standard variables).
              - { name: HTTPS_PROXY, value: "http://PROXY_HOST_PLACEHOLDER:3130" }
              - { name: NO_PROXY, value: "NO_PROXY_PLACEHOLDER" }
              - { name: PROXY_TEST_URL, value: "PROXY_TEST_URL_PLACEHOLDER" }
            volumeMounts:
              - { name: trust, mountPath: /etc/pki/ca-trust/extracted, readOnly: true }
            securityContext:
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile: { type: RuntimeDefault }
