# spark-submit through the OpenShift AI Spark Operator: PySpark job doing an S3A + JDBC
# round-trip. Application code comes from a ConfigMap here; credentials from a Secret.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: s3-jdbc-python
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: SPARK_IMAGE_PLACEHOLDER
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///jobs/s3_jdbc.py
  sparkVersion: 4.3.0
  restartPolicy: { type: Never }
  # Pod settings (env, volumes, securityContext) go in driver.template / executor.template.
  # The flat fields (driver.envFrom, spec.volumes, ...) are applied by the operator's pod
  # webhook, which OpenShift AI 3.5 only registers for the `default` namespace: anywhere else
  # they are silently ignored. Templates are passed to spark-submit and work in every namespace.
  # securityContext: NO runAsUser / runAsGroup - restricted-v2 assigns the UID.
  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark-operator-spark
    template:
      spec:
        volumes:
          - name: jobs
            configMap: { name: spark-test-jobs }
        containers:
          - name: spark-kubernetes-driver
            envFrom:
              - secretRef: { name: spark-datasources }
            volumeMounts:
              - { name: jobs, mountPath: /jobs }
            securityContext:
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile: { type: RuntimeDefault }
  executor:
    instances: 2
    cores: 1
    memory: 1g
    template:
      spec:
        containers:
          - name: spark-kubernetes-executor
            envFrom:
              - secretRef: { name: spark-datasources }
            securityContext:
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile: { type: RuntimeDefault }
