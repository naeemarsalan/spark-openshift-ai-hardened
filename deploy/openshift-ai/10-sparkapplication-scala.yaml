# spark-submit through the OpenShift AI Spark Operator: Scala job.
# securityContext: NO runAsUser / runAsGroup - restricted-v2 assigns the UID from the
# namespace range. (Upstream examples hard-code 185, which restricted-v2 rejects.)
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi-scala
spec:
  type: Scala
  mode: cluster
  image: SPARK_IMAGE_PLACEHOLDER
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples.jar
  arguments: ["200"]
  sparkVersion: 4.2.1
  restartPolicy: { type: Never }
  # Pod settings (env, volumes, securityContext) go in driver.template / executor.template.
  # The flat fields (driver.envFrom, spec.volumes, ...) are applied by the operator's pod
  # webhook, which OpenShift AI 3.5 only registers for the `default` namespace: anywhere else
  # they are silently ignored. Templates are passed to spark-submit and work in every namespace.
  # securityContext: NO runAsUser / runAsGroup - restricted-v2 assigns the UID.
  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark-operator-spark
    template:
      spec:
        containers:
          - name: spark-kubernetes-driver
            securityContext:
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile: { type: RuntimeDefault }
  executor:
    instances: 2
    cores: 1
    memory: 1g
    template:
      spec:
        containers:
          - name: spark-kubernetes-executor
            securityContext:
              capabilities: { drop: ["ALL"] }
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile: { type: RuntimeDefault }
